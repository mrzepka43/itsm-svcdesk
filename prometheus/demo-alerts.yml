# ai-generated: 75% - Copilot drafted symptom rules and checked thresholds against the recording baseline
groups:
  - name: shop-symptoms
    rules:
      - alert: ShopCheckoutErrors
        expr: |
          (
            sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
            /
            sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m]))
          ) > 0.05
        for: 1m
        labels:
          service: checkout
          severity: P1
          system: shop
        annotations:
          summary: "More than 5% of checkout requests are failing"

      - alert: ShopCheckoutSlow
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(traces_span_metrics_duration_milliseconds_bucket{
                service_name="checkout",
                span_name="oteldemo.CheckoutService/PlaceOrder",
                span_kind="SPAN_KIND_SERVER"
              }[5m])
            )
          ) > 250
        for: 1m
        labels:
          service: checkout
          severity: P1
          system: shop
        annotations:
          summary: "Checkout PlaceOrder p95 latency exceeds 250 ms"
