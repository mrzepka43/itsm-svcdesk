global:
  resolve_timeout: 5m
route:
  receiver: chat                  # the root: every alert enters here, and one that matches no child ends here
  group_by: [alertname, service]
  group_wait: 10s                 # the first notification of a new group waits this long: it is part of your MTTA
  group_interval: 1m
  repeat_interval: 4h
  routes:
    # TODO: the children (Lecture 4 slide 11): P1 to the pager; P2 and P3 to chat. One matcher per list item:
    # - matchers: ['severity="P1"']
    #   receiver: pager
receivers:
  - name: pager                   # the on-call's phone: http://localhost:18091 shows what reached it
    webhook_configs:
      - url: http://pager:8080/hook/pager
        send_resolved: true
  - name: chat
    webhook_configs:
      - url: http://pager:8080/hook/chat
        send_resolved: true
